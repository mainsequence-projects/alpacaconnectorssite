api_version: "2.3.0"
name: alpaca-connectors-site
resources:
# Same file and key as the 2.2.0 resource_release declaration, so the site keeps its UID, URL and
# Command Center link (the Alpaca Agent hands people that link for key entry).
- key: alpaca-connectors-site
  kind: static_site
  spec:
    name: Alpaca Connectors
    root_directory: ''
    framework: vite
    node_version: '24'
    output_directory: dist
    routing_mode: spa
    spa_entry_file: /index.html
    build_environment:
      # The connector's API, by repository and workflow key: the platform resolves its current
      # release UID at every build and rebuilds this site when that release is recreated.
      VITE_FASTAPI_RESOURCE_RELEASE_UID:
        resource_release:
          repository: alpaca-connectors
          key: alpaca
    automatic_redeployment:
      enabled: true
      tag_regex: null
    revision_retention_count: 3
    navigation_link:
      label: Alpaca Connectors
      icon_key: line-chart
      icon_mask_path: public/alpaca-navigation-logo.png
      is_enabled: true
      audiences:
        organization_wide: false
        team_uids: []
        user_uids:
        - e2a4f38a-1b5f-40a3-974f-70bc8f065b3f
